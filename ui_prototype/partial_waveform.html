  <!-- Large detailed view -->
  <section class="wf-row wf-detail" aria-label="Waveform detail">
    <svg viewBox="0 0 1000 160" preserveAspectRatio="none" aria-hidden="true">

      <div class="bracket bracket--sample"></div>
      <div class="bracket bracket--loop"></div>
      <div class="playhead"></div>
    </div>
  </section>

  <!-- big-number params under detail waveform -->
  <section class="wf-footer" aria-label="Sample range parameters">
    <div class="kv kv--wide inset">
      <div class="k">Sample Start</div>
      <div class="v mono">12,345,678</div>
    </div>
    <div class="kv kv--wide inset">
      <div class="k">Sample Length</div>
      <div class="v mono">123,456,789</div>
    </div>
    <div class="kv kv--wide inset">
      <div class="k">Loop Start</div>
      <div class="v mono">23,456,789</div>
    </div>
    <div class="kv kv--wide inset">
      <div class="k">Loop End</div>
      <div class="v mono">98,765,432</div>
    </div>
  </section>
