<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sampler Preset Editor — Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar" data-tpl="tpl-toolbar" aria-label="Toolbar"></header>

    <main class="content">
      <section class="pad-main" data-tpl="tpl-waveform" aria-label="Sample editor"></section>
      <section class="pad-details" data-tpl="tpl-pad-details" aria-label="Pad parameters"></section>
    </main>
  </div>

  <!-- file:// SAFE: no modules, no imports, no fetch() -->
  <script src="./tpl_toolbar.js"></script>
  <script src="./tpl_waveform.js"></script>
  <script src="./tpl_pad_details.js"></script>
  <script src="./tpl_pads.js"></script>
  <script src="./tpl_panel_main.js"></script>
  <script src="./tpl_panel_mod.js"></script>

  <script src="./ui.js"></script>
  <script src="./ui_knobs.js"></script>
</body>
</html>
