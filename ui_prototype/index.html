<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimal UI Skeleton</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app" role="application" aria-label="App skeleton">
    <header class="toolbar" aria-label="Top toolbar">
      <div class="placeholder">Toolbar (1000×50)</div>
    </header>

    <main class="content">
      <section class="pad-main" aria-label="Main pad section">
        <div class="placeholder">Main Pad Section / Waveform (1000×250)</div>
      </section>

      <section class="pad-details" aria-label="Pads and details">
        <div class="pads" aria-label="Pads grid (4×4)">
          <div class="pad">1</div><div class="pad">2</div><div class="pad">3</div><div class="pad">4</div>
          <div class="pad">5</div><div class="pad">6</div><div class="pad">7</div><div class="pad">8</div>
          <div class="pad">9</div><div class="pad">10</div><div class="pad">11</div><div class="pad">12</div>
          <div class="pad">13</div><div class="pad">14</div><div class="pad">15</div><div class="pad">16</div>
        </div>

        <div class="panel" aria-label="Details panel A">
          <div class="placeholder">Details Panel A</div>
        </div>

        <div class="panel" aria-label="Details panel B">
          <div class="placeholder">Details Panel B</div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
