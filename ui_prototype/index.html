<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimal UI Skeleton</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <div class="placeholder">Toolbar (1400×70)</div>
    </header>

    <main class="content">
      <section class="pad-main">
        <div class="placeholder">Main Pad Section / Waveform (1400×350)</div>
      </section>

      <section class="pad-details" aria-label="Pads & details">
        <!-- Pads column -->
        <div class="pads" aria-label="Pads grid (4×4)">
          <div class="pad">1</div><div class="pad">2</div><div class="pad">3</div><div class="pad">4</div>
          <div class="pad">5</div><div class="pad">6</div><div class="pad">7</div><div class="pad">8</div>
          <div class="pad">9</div><div class="pad">10</div><div class="pad">11</div><div class="pad">12</div>
          <div class="pad">13</div><div class="pad">14</div><div class="pad">15</div><div class="pad">16</div>
        </div>

        <!-- Middle column -->
        <div class="panel" aria-label="Details panel A">
          <div class="placeholder">Details Panel A</div>
        </div>

        <!-- Right column -->
        <div class="panel" aria-label="Details panel B">
          <section class="envelope" aria-label="Envelope">
            <div class="env-title">Envelope (ADSR)</div>

            <div class="env-graph" aria-label="Envelope graph">
              <!-- super simple straight-line ADSR -->
              <svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">
                <polyline points="0,38 18,6 38,22 62,22 92,38"
                          fill="none" stroke="currentColor" stroke-width="1.5" />
              </svg>
            </div>

            <div class="env-knobs" aria-label="ADSR knobs">
              <div class="knob">
                <div class="knob-ring"></div>
                <div class="knob-label">Attack</div>
              </div>
              <div class="knob">
                <div class="knob-ring"></div>
                <div class="knob-label">Decay</div>
              </div>
              <div class="knob">
                <div class="knob-ring"></div>
                <div class="knob-label">Sustain</div>
              </div>
              <div class="knob">
                <div class="knob-ring"></div>
                <div class="knob-label">Release</div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
